name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: tests/run.sh
      - run: shellcheck -S warning bin/justsay bin/omarchy-* install.sh tests/*.sh
