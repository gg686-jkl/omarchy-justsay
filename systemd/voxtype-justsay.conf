# Installed as ~/.config/systemd/user/voxtype.service.d/justsay.conf while
# Just Say cloud mode is active.
#  * gives Voxtype the loopback API key without writing it into config.toml
#  * RUST_LOG=warn keeps transcripts out of the persistent journal
#    (Voxtype logs a preview of every transcript at INFO level)
[Unit]
Wants=justsay-asr.service justsay-watch.service
After=justsay-asr.service

[Service]
EnvironmentFile=%h/.config/justsay/server.env
Environment=RUST_LOG=warn
